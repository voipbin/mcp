name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      # Scoped to the rules that catch real defects (undefined names, shadowed
      # imports, broken except clauses) rather than whole-repo style, so the
      # gate starts green and stays meaningful.
      - run: uvx ruff check --select E4,E7,E9,F .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    outputs:
      # A consumer that dereferences a property missing from this mapping gets
      # an empty string, not an error, so every value the smoke jobs need must
      # be declared here explicitly.
      floor: ${{ steps.meta.outputs.floor }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Pinned, not the runner default: the extraction below needs tomllib,
          # which is stdlib only from 3.11, and the floor smoke leg runs 3.10.
          python-version: "3.11"

      - id: meta
        run: python scripts/dist_meta.py >> "$GITHUB_OUTPUT"

      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  dist-smoke:
    needs: build
    uses: ./.github/workflows/dist-smoke.yml
    with:
      floor: ${{ needs.build.outputs.floor }}
      version: ${{ needs.build.outputs.version }}
